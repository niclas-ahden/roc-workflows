name: Test

on:
  workflow_call:
    inputs:
      package:
        description: Path to the package's main module
        type: string
        required: false
        default: package/main.roc
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            extra-substituters = https://niclas-ahden.cachix.org
            extra-trusted-public-keys = niclas-ahden.cachix.org-1:FdGli1vBk0cTuVJV27Tau/JvlbW+Ly3pRwFByyqdke0=
            accept-flake-config = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Keep the saved store under GitHub's 10 GB/repo cache budget.
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Writing to the cache is for the default branch only. A pull request
      # from a fork is handed no secret at all, and even one from a branch of
      # this repo should not publish store paths that nothing has merged yet.
      - name: Decide whether this run may write to the cache
        id: cache-write
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            reason="the caller passed no CACHIX_AUTH_TOKEN"
          elif [ "$GITHUB_EVENT_NAME" != push ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            reason="this is a $GITHUB_EVENT_NAME, not a push"
          elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            reason="$GITHUB_REF_NAME is not the default branch"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "This run pushes what it builds to niclas-ahden.cachix.org."
            exit 0
          fi
          echo "push=false" >> "$GITHUB_OUTPUT"
          echo "This run only reads the binary cache: $reason."

      # Puts `cachix` on PATH, authenticated, and installs a post-build-hook
      # that pushes each path as it is built. The explicit push further down
      # is still needed: on a store-cache hit nothing is built, so the hook
      # sees nothing, yet the path may still be missing from Cachix.
      - name: Authenticate with Cachix
        if: steps.cache-write.outputs.push == 'true'
        uses: cachix/cachix-action@v15
        with:
          name: niclas-ahden
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # --max-jobs 0 forbids local builds, so a compiler that is missing from
      # the binary cache is reported here instead of quietly costing the run
      # half an hour. The plain build after it is the fallback that keeps a
      # stale cache from failing the run outright.
      - name: Build Roc from the flake
        run: |
          nix build .#roc --max-jobs 0 || {
            echo "::warning::The pinned Roc compiler is not in the binary cache, so this run builds it from source. A push to the default branch of a repo holding the CACHIX_AUTH_TOKEN secret fills the cache; until one lands, every run pays this."
            nix build .#roc
          }

      # Before the test steps, not after: a suite that goes red does not make
      # the half hour of compiling worth repeating on the next run.
      #
      # The devShell goes too. It is what `./tests.roc` runs under below, and
      # what a contributor gets from `nix develop`, so leaving it out would
      # mean a cache that spares you the compiler and then builds playwright
      # and friends anyway. Realize it here even in a repo with no tests.roc,
      # so the pushed set does not depend on which steps happen to run.
      - name: Push the compiler and devShell to the binary cache
        if: steps.cache-write.outputs.push == 'true'
        run: |
          cachix push niclas-ahden ./result
          nix develop --profile "$RUNNER_TEMP/devshell" --command true
          cachix push niclas-ahden "$RUNNER_TEMP/devshell"

      - name: Check
        run: ./result/bin/roc check "${{ inputs.package }}"

      - name: Test
        run: |
          set +e
          ./result/bin/roc test "${{ inputs.package }}"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::roc test failed with exit code ${status}. If it printed no output, check that every dependency in ${{ inputs.package }} is a URL — path dependencies currently make roc test fail silently."
            exit "$status"
          fi

      # `roc bundle` can exit 0 while producing a tarball that is missing the
      # package's modules (seen with path dependencies), so bundling alone
      # proves nothing: assert that every module made it into the tarball.
      - name: Bundle sanity check
        run: |
          pkg_dir=$(dirname "${{ inputs.package }}")
          main=$(basename "${{ inputs.package }}")
          out="$RUNNER_TEMP/bundle-check"
          mkdir -p "$out"
          (cd "$pkg_dir" && "$GITHUB_WORKSPACE/result/bin/roc" bundle --output-dir "$out" "$main")
          tarball=$(find "$out" -name '*.tar.zst' | head -n 1)
          if [ -z "$tarball" ]; then
            echo "::error::roc bundle produced no tarball"
            exit 1
          fi
          tar -tf "$tarball" > "$RUNNER_TEMP/bundle-contents.txt"
          echo "Bundle contents:"
          cat "$RUNNER_TEMP/bundle-contents.txt"
          missing=0
          for f in "$pkg_dir"/*.roc; do
            name=$(basename "$f")
            if ! grep -qx "$name" "$RUNNER_TEMP/bundle-contents.txt"; then
              echo "::error::Bundle is missing ${name}"
              missing=1
            fi
          done
          exit "$missing"

      # The steps above run the project's own `expect` blocks, and this next
      # steps runs the project's `./tests.roc` script if it exists. That script
      # can contain whatever tests the project needs.
      - name: Project test script
        run: |
          if [ -x ./tests.roc ]; then
            nix develop -c ./tests.roc
          elif [ -f ./tests.roc ]; then
            # Silently skipping would look identical to passing, so be loud.
            echo "::error::./tests.roc exists but is not executable. Run: chmod +x tests.roc"
            exit 1
          else
            echo "No ./tests.roc in this repository, nothing to run."
          fi
